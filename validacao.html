<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dados do Aluno - UNIP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px 14px;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .header {
      background: #1e3a8a;
      color: white;
      padding: 14px 18px;
      font-size: 17px;
      font-weight: 700;
      text-align: right;
    }

    .content {
      padding: 22px 18px;
    }

    .linha {
      display: flex;
      margin-bottom: 11px;
      font-size: 14.5px;
      align-items: flex-start;
    }

    .label {
      width: 115px;
      font-weight: 700;
      color: #1e3a8a;
      flex-shrink: 0;
    }

    .valor {
      color: #1e3a8a;
      font-weight: 500;
      word-break: break-word;
    }

    .status {
      margin-top: 22px;
      padding: 13px;
      background: #dcfce7;
      border: 1px solid #86efac;
      border-radius: 10px;
      text-align: center;
      color: #166534;
      font-weight: 700;
      font-size: 14.5px;
    }

    .validade {
      margin-top: 12px;
      padding: 12px;
      background: #1e3a8a;
      color: white;
      text-align: center;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14.5px;
    }

    .aviso {
      margin-top: 18px;
      font-size: 12px;
      color: #888;
      text-align: center;
      line-height: 1.5;
    }

    .btn-concluir {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px 16px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-concluir:active {
      background: #152a66;
    }

    @media (min-width: 600px) {
      body { padding: 40px 20px; }
      .container { max-width: 520px; border-radius: 10px; }
      .header { font-size: 18px; padding: 16px 22px; }
      .content { padding: 26px 22px; }
      .linha { font-size: 15px; margin-bottom: 12px; }
      .label { width: 130px; }
      .status, .validade { font-size: 15px; }
      .btn-concluir { font-size: 15.5px; padding: 15px; }
    }

    @media (max-width: 380px) {
      body { padding: 12px 10px; }
      .label { width: 100px; font-size: 13.5px; }
      .valor { font-size: 13.5px; }
      .header { font-size: 15px; padding: 12px 14px; }
      .content { padding: 16px 14px; }
      .btn-concluir { font-size: 14px; padding: 13px; }
    }
  </style>
</head>
<body>

  <div class="container" id="container">
    <div class="header" id="header">Dados do Aluno</div>

    <div class="content" id="conteudo">
      <div class="linha">
        <div class="label">Matrícula:</div>
        <div class="valor" id="matricula">—</div>
      </div>
      <div class="linha">
        <div class="label">Nome:</div>
        <div class="valor" id="nome">—</div>
      </div>
      <div class="linha">
        <div class="label">Nascimento:</div>
        <div class="valor" id="nascimento">—</div>
      </div>
      <div class="linha">
        <div class="label">Curso:</div>
        <div class="valor" id="curso">—</div>
      </div>
      <div class="linha">
        <div class="label">Unidade:</div>
        <div class="valor" id="unidade">—</div>
      </div>

      <div class="status">
        ✓ Carteirinha VÁLIDA
      </div>

      <div class="validade">
        Validade: <span id="validadeTexto">—</span>
      </div>

      <div class="aviso">
        Documento de identificação estudantil<br>
        Esta página fecha automaticamente em <span id="tempo">30</span> segundos
      </div>

      <a href="https://www.unip.br" class="btn-concluir">
        Consulta concluída →
      </a>
    </div>
  </div>

  <script>
    function getValidade() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      return month <= 6 ? `JUN/${year}` : `DEZ/${year}`;
    }

    function tentarTelaCheia() {
      const el = document.documentElement;
      try {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
        else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
      } catch (e) {}
    }

    const params = new URLSearchParams(window.location.search);

    const matricula = params.get("m");
    const nome = params.get("n");
    const nascimento = params.get("nasc");
    const curso = params.get("c");
    const unidade = params.get("u");

    if (!matricula || !nome || !nascimento || !curso) {
      window.location.replace("https://www.unip.br");
    } else {
      document.getElementById("matricula").textContent = matricula;
      document.getElementById("nome").textContent = nome;
      document.getElementById("nascimento").textContent = nascimento;
      document.getElementById("curso").textContent = curso;
      document.getElementById("unidade").textContent = unidade || "—";
      document.getElementById("validadeTexto").textContent = getValidade();

      tentarTelaCheia();
      setTimeout(tentarTelaCheia, 300);

      let segundos = 30;
      const tempoEl = document.getElementById("tempo");

      const intervalo = setInterval(() => {
        segundos--;
        if (tempoEl) tempoEl.textContent = segundos;

        if (segundos <= 0) {
          clearInterval(intervalo);
          window.location.replace("https://www.unip.br");
        }
      }, 1000);

      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, "", window.location.pathname);
      }
    }
  </script>
</body>
</html>
